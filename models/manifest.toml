version = 1

# Model downloads are explicit: `cargo run -- models fetch ...`.
# Server startup NEVER downloads files.
#
# A source may be `raw`, `zip`, or `tar_gz`. For archives, each voice uses
# `source_path` to select its .htsvoice member. Set sha256 whenever possible;
# KoeServe refuses an unpinned source unless --allow-unverified is supplied.


# MMDAgent Example 1.8 official SourceForge distribution.
# The archive contains Mei (5 styles), Takumi (4 styles), and CMU ARCTIC SLT.
# The MMDAgent sample README instructs users to consult the README/COPYRIGHT
# files in each content directory. The voice models are distributed under
# Creative Commons Attribution terms; keep attribution/license notices when
# redistributing models or generated bundles.
[[sources]]
id = "mmdagent-example-1.8"
url = "https://downloads.sourceforge.net/project/mmdagent/MMDAgent_Example/MMDAgent_Example-1.8/MMDAgent_Example-1.8.zip"
format = "zip"
license = "Mixed bundled voice notices (Mei/Takumi: CC-BY-3.0; see retained files)"
license_url = "https://mmdagent.wordpress.com/2013/12/13/license-terms-of-for-the-all-files-other-than-the-3-d-model-mei/"
license_paths = [
  "MMDAgent_Example-1.8/Voice/mei/COPYRIGHT.txt",
  "MMDAgent_Example-1.8/Voice/mei/README.txt",
  "MMDAgent_Example-1.8/Voice/takumi/COPYRIGHT.txt",
  "MMDAgent_Example-1.8/Voice/takumi/README.txt",
]
# sha256 = "<pin the downloaded MMDAgent_Example-1.8.zip SHA-256 here>"

# Verified upstream/license example: Tohoku-f01 is published by Tohoku
# University's ICN Lab under CC BY 4.0.
# Add a SHA-256 before using automatic fetch in production.
[[sources]]
id = "tohoku-f01"
url = "https://github.com/icn-lab/htsvoice-tohoku-f01/archive/refs/heads/master.zip"
format = "zip"
license = "CC-BY-4.0"
license_url = "https://raw.githubusercontent.com/icn-lab/htsvoice-tohoku-f01/master/COPYRIGHT.txt"
license_paths = [
  "htsvoice-tohoku-f01-master/COPYRIGHT.txt",
  "htsvoice-tohoku-f01-master/README.md",
]
# sha256 = "<pin the downloaded archive SHA-256 here>"

# Open JTalk's official SourceForge distribution of NIT ATR503 M001 v1.05.
[[sources]]
id = "m001-1.05"
url = "https://sourceforge.net/projects/open-jtalk/files/HTS%20voice/hts_voice_nitech_jp_atr503_m001-1.05/hts_voice_nitech_jp_atr503_m001-1.05.tar.gz/download"
format = "tar_gz"
license = "CC-BY-3.0"
license_paths = [
  "hts_voice_nitech_jp_atr503_m001-1.05/COPYING",
  "hts_voice_nitech_jp_atr503_m001-1.05/README",
]
# sha256 = "<pin the downloaded archive SHA-256 here>"

[[voices]]
